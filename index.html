<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-WMB2TZX');</script>
  <!-- End Google Tag Manager -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <title>AVS4YOU Plugins Marketplace</title>
  <style>
    :root {
      /* Windows fonts: the store is opened on Windows, in a browser or inside an AVS app,
         so nothing is fetched and nothing changes once the page is drawn. Segoe UI has
         400, 600 (Semibold), 700 (Bold) and 900 (Black) - no 800: a weight of 800 would
         come out as Black. */
      --font-ui: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      --font-mono: Consolas, "Cascadia Mono", "Courier New", monospace;
      --accent: #1577e0;
      --accent-dark: #1463c4;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --line: #e1e9f2;
      --line-soft: #e7edf4;
      --text: #16202e;
      --muted: #5b6b7e;
      --faint: #8494a8;
      --shadow: 0 2px 8px rgba(16, 32, 46, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--text);
      background: var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
    }

    .app-shell {
      height: 100vh;
      display: flex;
      background: var(--bg);
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      flex: 0 0 250px;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }

    .brand {
      padding: 18px 18px 16px;
      line-height: 1;
    }

    .brand-title {
      font-family: var(--font-ui);
      font-size: 14.5px;
      font-weight: 700;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: var(--accent);
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .install-file-wrap {
      padding: 14px 12px 8px;
    }

    .install-file-btn {
      width: 100%;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #2b9bf4, #1577e0);
      box-shadow: 0 3px 8px rgba(21, 119, 224, 0.28);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .install-file-wrap[hidden] {
      display: none;
    }

    .rail-section {
      padding: 6px 12px 0;
    }

    .rail-section + .rail-section {
      padding-top: 18px;
    }

    .rail-title {
      padding: 0 8px 8px;
      color: #9aa8bc;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .rail-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 38px;
      padding: 9px 11px;
      margin-bottom: 2px;
      border-radius: 9px;
      color: #46566b;
      background: transparent;
      font-size: 13.5px;
      font-weight: 400;
      cursor: pointer;
      text-align: left;
    }

    .rail-button.active {
      color: var(--accent-dark);
      background: #eef4fc;
      font-weight: 600;
    }

    .rail-button .rail-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #9aa8bc;
      font-size: 13px;
    }

    .rail-button.active .rail-icon {
      color: var(--accent);
    }

    .rail-button .rail-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rail-count {
      color: #a6b3c4;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 700;
    }

    .rail-button.active .rail-count {
      color: var(--accent);
    }

    .app-badge {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: #fff;
      font-family: var(--font-ui);
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .app-badge.app-icon {
      object-fit: contain;
      background: transparent;
    }


    .main {
      height: 100vh;
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      min-height: 64px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }

    .heading {
      min-width: 145px;
      line-height: 1;
    }

    .heading-title {
      font-size: 16px;
      font-weight: 700;
    }

    .heading-subtitle {
      margin-top: 5px;
      color: var(--faint);
      font-size: 11.5px;
      font-weight: 400;
    }

    .toolbar-spacer {
      flex: 1;
    }

    .search {
      width: min(260px, 32vw);
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
    }

    .search span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #9aa8bc;
    }

    .svg-icon {
      width: 16px;
      height: 16px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rail-icon .svg-icon {
      width: 15px;
      height: 15px;
    }

    .view-button .svg-icon {
      width: 17px;
      height: 17px;
    }

    .search input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 500;
    }

    .segmented {
      flex: 0 0 auto;
      display: flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f0f4f9;
    }

    .view-button {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      background: transparent;
      color: #9aa8bc;
      font-size: 15px;
      cursor: pointer;
    }

    .view-button.active {
      background: #fff;
      color: var(--accent);
      box-shadow: 0 1px 3px rgba(16, 32, 46, 0.14);
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 20px 22px 26px;
    }

    .plugins {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .plugins.list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .plugin-card {
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .plugins .plugin-card,
    .plugin-open {
      cursor: pointer;
    }

    .plugin-open {
      max-width: 100%;
      padding: 0;
      background: transparent;
      color: inherit;
      font-weight: inherit;
      text-align: left;
    }

    .plugin-open:hover {
      color: var(--accent-dark);
    }

    .plugin-details {
      --details-max-height: calc(100dvh - 24px);
      width: min(640px, calc(100% - 32px));
      max-height: var(--details-max-height);
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
    }

    .plugin-details .plugin-card {
      max-height: var(--details-max-height);
      border: 0;
    }

    .plugin-details .card-body {
      min-height: 0;
    }

    .plugin-details .preview,
    .plugin-details .plugin-heading,
    .plugin-details .card-bottom {
      flex-shrink: 0;
    }

    .plugin-details-description {
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding-bottom: 12px;
    }

    .plugin-details-description .plugin-desc + .plugin-desc {
      margin-top: 9px;
    }

    .plugin-details::backdrop {
      background: rgba(14, 27, 43, 0.65);
    }

    .plugin-details .preview {
      --preview-max-height: max(56px, calc(var(--details-max-height) - 185px));
      height: clamp(145px, 36vh, 320px);
      max-height: var(--preview-max-height);
    }

    .plugin-details .preview:has(img:not(.icon-media)) {
      height: auto;
    }

    .plugin-details .preview img:not(.icon-media) {
      position: relative;
      display: block;
      height: auto;
      max-height: var(--preview-max-height);
      object-fit: contain;
    }

    .plugin-details .preview img.icon-media {
      max-height: 100%;
    }

    .plugin-details .preview-ai {
      right: 56px;
    }

    .plugin-details .plugin-title {
      font-size: 22px;
      white-space: normal;
    }

    .plugin-details .plugin-desc {
      display: block;
      overflow: visible;
      font-size: 14px;
    }

    .plugin-details-close {
      position: absolute;
      z-index: 3;
      top: 8px;
      right: 8px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
    }

    .preview {
      position: relative;
      height: 158px;
      overflow: hidden;
      background: #0e1b2b;
    }

    .preview-bg,
    .preview img {
      position: absolute;
      inset: 0;
    }

    .preview-bg {
      z-index: 0;
    }

    .preview img {
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview img.icon-media {
      width: 88px;
      height: 88px;
      margin: auto;
      object-fit: contain;
    }

    .preview-badges {
      position: absolute;
      top: 11px;
      left: 11px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .preview-ai {
      position: absolute;
      top: 11px;
      right: 11px;
      z-index: 2;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 21px;
      padding: 0 9px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--accent-dark);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    .badge.key {
      color: #b5701a;
    }

    .badge.ai {
      background: rgba(15, 16, 30, 0.55);
      color: #ffd9ae;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #fda050;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 15px 16px 16px;
    }

    .plugin-title {
      margin: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 15.5px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .plugin-desc {
      margin: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.5;
    }

    .card-bottom {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 13px;
      border-top: 1px solid #eef2f7;
    }

    .meta {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-text {
      color: #9aa8bc;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 400;
      white-space: nowrap;
    }

    .platforms {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f0f4f9;
    }

    .platform-chip {
      padding: 3px 9px;
      border-radius: 5px;
      background: transparent;
      color: var(--faint);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .platform-chip.active {
      background: var(--accent);
      color: #fff;
    }

    .download-btn {
      height: 34px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #2b9bf4, #1577e0);
      box-shadow: 0 3px 8px rgba(21, 119, 224, 0.28);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .plugins.list .plugin-card {
      min-height: 88px;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      padding: 14px 18px;
    }

    .plugins.list .preview {
      width: 60px;
      height: 60px;
      flex: 0 0 60px;
      border-radius: 8px;
    }

    .plugins.list .preview-badges,
    .plugins.list .preview-ai {
      display: none;
    }

    .plugins.list .preview img.icon-media {
      width: 100%;
      height: 100%;
      transform: scale(1.25);
    }

    .plugins.list .card-body {
      min-width: 0;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(180px, 300px) minmax(160px, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 0;
    }

    .plugins.list .plugin-heading {
      min-width: 0;
    }

    .plugins.list .plugin-title {
      font-size: 15px;
    }

    .plugins.list .plugin-desc {
      min-width: 0;
      -webkit-line-clamp: 2;
    }

    .plugins.list .card-bottom {
      flex: 0 0 auto;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .empty {
      flex: 1;
      display: none;
      text-align: center;
      padding: 56px 20px;
    }

    .empty.visible {
      display: block;
    }

    .empty h3 {
      margin: 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
    }

    .empty p {
      margin: 7px 0 18px;
      color: #62718a;
      font-size: 13px;
    }

    .reset-btn {
      height: 38px;
      padding: 0 18px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: auto -22px -26px;
      padding: 15px 22px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .footer[hidden] {
      display: none;
    }

    .footer.after-scroll {
      margin-top: 34px;
    }

    .footer-note {
      color: var(--faint);
      font-size: 12px;
      font-weight: 400;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .footer-links a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-sep {
      width: 1px;
      height: 13px;
      background: #dce4ee;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      max-width: min(420px, calc(100vw - 36px));
      padding: 12px 14px;
      border-radius: 8px;
      background: #16202e;
      color: #fff;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.22);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1080px) {
      .plugins.list .card-body {
        grid-template-columns: minmax(160px, 260px) minmax(140px, 1fr);
      }

      .plugins.list .card-bottom {
        grid-column: 1 / -1;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    @media (max-width: 900px) {
      .toolbar {
        flex-wrap: wrap;
        gap: 10px;
      }

      .toolbar-spacer {
        display: none;
      }

      .search {
        order: 3;
        width: 100%;
      }
    }

    @media (max-width: 720px) {
      .toolbar,
      .content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .plugins {
        grid-template-columns: 1fr;
      }

      .plugins.list .plugin-card {
        flex-direction: column;
        align-items: stretch;
      }

      .plugins.list .preview {
        width: 100%;
        height: 120px;
        flex-basis: auto;
      }

      .plugins.list .preview-badges,
      .plugins.list .preview-ai {
        display: flex;
      }

      .plugins.list .card-body {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 9px;
      }

      .plugins.list .card-bottom {
        padding-top: 13px;
        border-top: 1px solid #eef2f7;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
        margin-left: -14px;
        margin-right: -14px;
        padding-left: 14px;
        padding-right: 14px;
      }

      .footer-links {
        flex-wrap: wrap;
        gap: 10px;
      }

      .footer-sep {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WMB2TZX" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="app-shell" id="shell">
    <aside class="sidebar" aria-label="Marketplace filters">
      <div class="brand">
        <div class="brand-title">AVS4YOU</div>
        <div class="brand-subtitle">Plugin Marketplace</div>
      </div>

      <div class="install-file-wrap" id="installFileWrap" hidden>
        <button class="install-file-btn" id="installFile" type="button">Install from file</button>
      </div>

      <div class="rail-section">
        <div class="rail-title">Categories</div>
        <div id="categories"></div>
      </div>

      <div class="rail-section">
        <div class="rail-title">Applications</div>
        <div id="apps"></div>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="heading">
          <div class="heading-title" id="currentTitle">All plugins</div>
          <div class="heading-subtitle" id="resultLabel">0 plugins available</div>
        </div>
        <div class="toolbar-spacer"></div>
        <label class="search">
          <span aria-hidden="true" data-icon="search"></span>
          <input id="search" type="search" placeholder="Search plugins..." autocomplete="off">
        </label>
        <div class="segmented" aria-label="View">
          <button class="view-button active" id="gridView" type="button" title="Grid view" aria-label="Grid view"></button>
          <button class="view-button" id="listView" type="button" title="List view" aria-label="List view"></button>
        </div>
      </header>

      <section class="content">
        <div class="plugins" id="plugins"></div>
        <div class="empty" id="empty">
          <h3>No plugins match</h3>
          <p>Try another category, app, or search.</p>
          <button class="reset-btn" id="reset" type="button">Reset filters</button>
        </div>
        <footer class="footer" id="footer">
          <div class="footer-note">All plugins are open source and available on GitHub</div>
          <div class="footer-links">
            <a href="https://github.com/avs4you/avs4you.github.io" target="_blank" rel="noopener">View on GitHub</a>
            <span class="footer-sep"></span>
            <a href="docs">Documentation</a>
            <span class="footer-sep"></span>
            <a href="https://avs4you.com" target="_blank" rel="noopener">Visit AVS4YOU</a>
          </div>
        </footer>
      </section>
    </main>
  </div>
  <dialog class="plugin-details" id="pluginDetails" aria-labelledby="pluginDetailsTitle">
    <button class="plugin-details-close" id="closePluginDetails" type="button" aria-label="Close plugin details" autofocus>
      <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 5l14 14M19 5 5 19"/>
      </svg>

  <script>
    let PLUGINS = [];

    const ICON_PLUGIN_BACKGROUND = "linear-gradient(135deg,#0FB5C9,#1577E0)";
    // Architectures come from the data (package.py writes plugin.downloads),
    // so adding one only means adding it to ARCHS in release.py. A browser
    // visitor picks one per plugin; inside an AVS app the app's own
    // (?platform=) is used. x86 by default: older AVS apps open the store
    // without ?platform, and they are 32-bit.
    const DEFAULT_ARCH = "x86";

    // In a plain browser the default is the Windows the page runs on: 64-bit
    // Windows gets the x64 packages. The user agent says "Win64; x64" (64-bit
    // browser) or "WOW64" (32-bit browser on 64-bit Windows); not Windows at all
    // also means x64. Chromium freezes its user agent at "Win64; x64" whatever the
    // system, so there the bitness client hint corrects it (refineBrowserArch).
    function guessBrowserArch() {
      const ua = navigator.userAgent || "";
      if (!/Windows/i.test(ua)) return "x64";
      return /Win64|WOW64|x64|x86_64|amd64|arm64|aarch64/i.test(ua) ? "x64" : "x86";
    }

    const ICONS = {
      search: '<svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',

      ai: '<svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M19.1 4.9l-2.8 2.8M7.7 16.3l-2.8 2.8"/><circle cx="12" cy="12" r="3"/></svg>',

    const CATEGORIES = [
      { key: "all", label: "All plugins", icon: "all" },
      { key: "ai", label: "AI Powered", icon: "ai" },
      { key: "effect", label: "Effects", icon: "effect" },
      { key: "content", label: "Content", icon: "content" }
    ];

    const APPS = [
      { key: "all", label: "All apps", icon: "all" },
      { key: "Video Converter", label: "AVS Video Converter", asset: "assets/AVSVideoConverter_Icon.png" },
      { key: "Video Editor", label: "AVS Video Editor", asset: "assets/AVSVideoEditor_Icon.png" },
      { key: "Image Converter", label: "AVS Image Converter", asset: "assets/AVSImageConverter_Icon.png" },
      { key: "Audio Editor", label: "AVS Audio Editor", asset: "assets/AVSAudioEditor_Icon.png" },
      { key: "Audio Converter", label: "AVS Audio Converter", asset: "assets/AVSAudioConverter_Icon.png" },
      { key: "Video ReMaker", label: "AVS Video ReMaker", asset: "assets/AVSVideoReMaker_Icon.png" }
    ];

    function getAppLabel(appKey) {
      const app = APPS.find((item) => item.key === appKey);
      return app ? app.label : appKey;
    }

    const params = new URLSearchParams(window.location.search);
    const typeParam = (params.get("type") || "").toLowerCase();
    const typeAppFilter = {
      vc: "Video Converter",
      ve: "Video Editor",
      ic: "Image Converter",
      ae: "Audio Editor",
      ac: "Audio Converter",
      rm: "Video ReMaker"
    };
    const initialAppFilter = typeAppFilter[typeParam] || "all";
    const isApp = typeParam === "app" || initialAppFilter !== "all";
    const state = {
      isApp,
      appPlatform: params.get("platform") || (isApp ? DEFAULT_ARCH : guessBrowserArch()),
      category: "all",
      app: initialAppFilter,
      search: "",
      view: "grid",
      platform: {}
    };

    const els = {
      brand: document.querySelector(".brand"),
      installFileWrap: document.getElementById("installFileWrap"),
      installFile: document.getElementById("installFile"),
      categories: document.getElementById("categories"),
      apps: document.getElementById("apps"),
      plugins: document.getElementById("plugins"),
      empty: document.getElementById("empty"),
      reset: document.getElementById("reset"),
      search: document.getElementById("search"),
      currentTitle: document.getElementById("currentTitle"),
      resultLabel: document.getElementById("resultLabel"),
      gridView: document.getElementById("gridView"),
      listView: document.getElementById("listView"),
      footer: document.getElementById("footer"),
      pluginDetails: document.getElementById("pluginDetails"),
      pluginDetailsContent: document.getElementById("pluginDetailsContent"),
      closePluginDetails: document.getElementById("closePluginDetails"),
      toast: document.getElementById("toast")
    };

    let toastTimer = null;

    function renderStaticIcons() {
      els.gridView.innerHTML = ICONS.grid;
      els.listView.innerHTML = ICONS.list;
      document.querySelectorAll("[data-icon]").forEach((element) => {
        element.innerHTML = ICONS[element.dataset.icon] || "";
      });
    }

    function loadPlugins() {
      const node = document.getElementById("plugins-data");
      if (!node) throw new Error("Missing plugins-data");
      PLUGINS = JSON.parse(node.textContent || "[]");
    }

    function matchCategory(plugin, category) {
      if (category === "all") return true;
      if (category === "effect") return plugin.type === "effect";
      if (category === "ai") return plugin.aiPowered;
      if (category === "content") return plugin.type === "content";
      return true;
    }

    function getHref(plugin, platform) {
      // Absolute GitHub release links baked in by package.py, keyed by arch.
      const downloads = plugin.downloads || {};
      return downloads[platform] || downloads[DEFAULT_ARCH] || "";
    }

    function getFilteredPlugins() {
      const query = state.search.trim().toLowerCase();
      return PLUGINS.filter((plugin) => {
        if (!matchCategory(plugin, state.category)) return false;
        if (state.app !== "all" && !plugin.apps.includes(state.app)) return false;
        if (!query) return true;
        return (
          plugin.name.toLowerCase().includes(query) ||
          plugin.desc.toLowerCase().includes(query) ||
          plugin.typeLabel.toLowerCase().includes(query)
        );
      });
    }

    function makeButton(item, active, count, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "rail-button" + (active ? " active" : "");
      button.addEventListener("click", onClick);

      const icon = document.createElement(item.asset ? "img" : "span");
      if (item.asset) {
        icon.className = "app-badge app-icon";
        icon.src = item.asset;
        icon.alt = "";
        icon.setAttribute("aria-hidden", "true");
      } else {
        icon.className = "rail-icon";
        icon.innerHTML = ICONS[item.icon] || "";
      }

      const label = document.createElement("span");
      label.className = "rail-label";
      label.textContent = item.label;

      const counter = document.createElement("span");
      counter.className = "rail-count";
      counter.textContent = count;

      button.append(icon, label, counter);
      return button;
    }

    function renderFilters() {
      els.categories.replaceChildren();
      CATEGORIES.forEach((item) => {
        const count = PLUGINS.filter((plugin) => matchCategory(plugin, item.key)).length;
        els.categories.appendChild(makeButton(item, state.category === item.key, count, () => {
          state.category = item.key;
          render();
        }));
      });

      els.apps.replaceChildren();
      APPS.forEach((item) => {
        const count = item.key === "all"
          ? PLUGINS.length
          : PLUGINS.filter((plugin) => plugin.apps.includes(item.key)).length;
        els.apps.appendChild(makeButton(item, state.app === item.key, count, () => {
          state.app = item.key;
          render();
        }));
      });
    }

    function makeBadge(text, className) {
      const badge = document.createElement("span");
      badge.className = "badge" + (className ? " " + className : "");
      badge.textContent = text;
      return badge;
    }

    function makeAiBadge() {
      const badge = makeBadge("AI", "ai");
      const dot = document.createElement("span");
      dot.className = "dot";
      badge.prepend(dot);
      return badge;
    }

    function makePlatformChips(plugin, activePlatform, detailed) {
      if (state.isApp) return null;

      const wrap = document.createElement("span");
      wrap.className = "platforms";

      Object.keys(plugin.downloads || {}).forEach((platform) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "platform-chip" + (platform === activePlatform ? " active" : "");
        chip.textContent = platform;
        chip.setAttribute("aria-pressed", platform === activePlatform ? "true" : "false");
        chip.addEventListener("click", () => {
          state.platform[plugin.slug] = platform;
          renderPlugins();
          // the details dialog holds its own copy of the card
          if (detailed) els.pluginDetailsContent.replaceChildren(makeCard(plugin, true));
        });
        wrap.appendChild(chip);
      });

      return wrap;
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        els.toast.classList.remove("visible");
      }, 2800);
    }

    // the host opens its own file dialog and installs the chosen .avsp
    function installFromFile() {
      if (!state.isApp) return;

      try {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage("install-from-file");
        }
      } catch (error) {
        // WebView messaging is only available inside the host application.
      }
    }

    function handleAction(event, href) {
      if (!state.isApp) return;

      event.preventDefault();
      try {
        if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage("download|" + href);
        }
      } catch (error) {
        // WebView messaging is only available inside the host application.
      }
      showToast("Install requested: " + href.split("/").pop());
    }

    function makeCard(plugin, detailed = false) {
      const activePlatform = state.isApp
        ? state.appPlatform
        : (state.platform[plugin.slug] || state.appPlatform);
      const href = getHref(plugin, activePlatform);
      const card = document.createElement("article");
      card.className = "plugin-card";

      const preview = document.createElement("div");
      preview.className = "preview";

      const previewBg = document.createElement("div");
      previewBg.className = "preview-bg";
      previewBg.style.background = /\.ico$/i.test(plugin.media || "")
        ? ICON_PLUGIN_BACKGROUND
        : plugin.tint;
      preview.appendChild(previewBg);

      if (plugin.media) {
        const image = document.createElement("img");
        image.src = plugin.media;
        image.alt = plugin.name;
        if (/\.ico$/i.test(plugin.media)) image.className = "icon-media";
        preview.appendChild(image);
      }

      const badges = document.createElement("div");
      badges.className = "preview-badges";
      badges.appendChild(makeBadge(plugin.typeLabel));
      if (plugin.requiresKey) badges.appendChild(makeBadge("API key", "key"));
      preview.appendChild(badges);

      if (plugin.aiPowered) {
        const ai = document.createElement("div");
        ai.className = "preview-ai";
        ai.appendChild(makeAiBadge());
        preview.appendChild(ai);
      }

      const body = document.createElement("div");
      body.className = "card-body";

      const heading = document.createElement("div");
      heading.className = "plugin-heading";

      const title = document.createElement(detailed ? "h2" : "h3");
      title.className = "plugin-title";
      if (detailed) {
        title.id = "pluginDetailsTitle";
        title.textContent = plugin.name;
      } else {
        const open = document.createElement("button");
        open.type = "button";
        open.className = "plugin-open";
        open.setAttribute("aria-haspopup", "dialog");
        open.textContent = plugin.name;
        title.appendChild(open);

        card.addEventListener("click", (event) => {
          if (event.target.closest("a, button") && !open.contains(event.target)) return;
          els.pluginDetailsContent.replaceChildren(makeCard(plugin, true));
          open.focus({ preventScroll: true });
          els.pluginDetails.showModal();
        });
      }
      heading.appendChild(title);

      const desc = document.createElement("p");
      desc.className = "plugin-desc";
      desc.textContent = plugin.desc;

      const bottom = document.createElement("div");
      bottom.className = "card-bottom";

      const meta = document.createElement("div");
      meta.className = "meta";

      const metaText = document.createElement("span");
      metaText.className = "meta-text";
      metaText.textContent = state.isApp
        ? activePlatform + " \u00b7 " + plugin.version
        : plugin.version;

      const platformChips = makePlatformChips(plugin, activePlatform, detailed);
      meta.append(metaText);
      if (platformChips) meta.append(platformChips);

      const link = document.createElement("a");
      link.className = "download-btn";
      link.href = state.isApp ? "#" : href;
      link.textContent = state.isApp ? "Install" : "Download";
      if (!state.isApp) link.setAttribute("download", "");
      link.addEventListener("click", (event) => {
        if (detailed && state.isApp) els.pluginDetails.close();
        handleAction(event, href);
      });

      bottom.append(meta, link);
      body.appendChild(heading);
      if (detailed) {
        const description = document.createElement("div");
        description.className = "plugin-details-description";
        description.setAttribute("role", "region");
        description.setAttribute("aria-label", "Plugin description");
        description.tabIndex = 0;
        description.appendChild(desc);
        if (plugin.apps.length) {
          const apps = document.createElement("p");
          apps.className = "plugin-desc";
          apps.textContent = "Compatible with: " + plugin.apps.map(getAppLabel).join(", ");
          description.appendChild(apps);
        }
        body.appendChild(description);
      } else {
        body.appendChild(desc);
      }
      body.appendChild(bottom);
      card.append(preview, body);
      return card;
    }

    function renderPlugins() {
      const filtered = getFilteredPlugins();
      els.plugins.className = "plugins" + (state.view === "list" ? " list" : "");
      els.plugins.replaceChildren(...filtered.map((plugin) => makeCard(plugin)));
      els.empty.classList.toggle("visible", filtered.length === 0);
      els.plugins.style.display = filtered.length === 0 ? "none" : "";
      requestAnimationFrame(() => {
        const content = document.querySelector(".content");
        const canScroll = content.scrollHeight > content.clientHeight + 1;
        els.footer.classList.toggle("after-scroll", canScroll);
      });

      const currentCategory = CATEGORIES.find((item) => item.key === state.category);
      els.currentTitle.textContent = state.app !== "all"
        ? getAppLabel(state.app)
        : (currentCategory ? currentCategory.label : "All plugins");
      els.resultLabel.textContent = filtered.length === PLUGINS.length
        ? PLUGINS.length + " plugins available"
        : filtered.length + " of " + PLUGINS.length + " shown";
    }

    function render() {
      els.gridView.classList.toggle("active", state.view === "grid");
      els.listView.classList.toggle("active", state.view === "list");
      els.footer.hidden = state.isApp;
      els.brand.hidden = state.isApp;
      els.installFileWrap.hidden = !state.isApp;
      renderFilters();
      renderPlugins();
    }

    els.closePluginDetails.addEventListener("click", () => els.pluginDetails.close());

    els.pluginDetails.addEventListener("click", (event) => {
      if (event.target === els.pluginDetails) els.pluginDetails.close();
    });

    els.installFile.addEventListener("click", installFromFile);

    els.gridView.addEventListener("click", () => {
      state.view = "grid";
      render();
    });

    els.listView.addEventListener("click", () => {
      state.view = "list";
      render();
    });

    els.search.addEventListener("input", (event) => {
      state.search = event.target.value;
      renderPlugins();
    });

    els.reset.addEventListener("click", () => {
      state.category = "all";
      state.app = "all";
      state.search = "";
      els.search.value = "";
      render();
    });

    async function init() {
      renderStaticIcons();
      try {
        loadPlugins();
      } catch (error) {
        console.warn(error);
        els.currentTitle.textContent = "Plugins unavailable";
        els.resultLabel.textContent = "Could not load plugin data";
        els.empty.classList.add("visible");
        els.empty.querySelector("h3").textContent = "Plugins unavailable";
        els.empty.querySelector("p").textContent = "Run package.py and reload the page.";
        els.reset.hidden = true;
        els.footer.hidden = true;
        return;
      }
      render();
      refineBrowserArch();
    }

    // Chromium on Windows: the bitness client hint ("64" or "32") instead of the
    // frozen user agent. Only the default changes; a chip the visitor picked stays.
    function refineBrowserArch() {
      const hints = navigator.userAgentData;
      if (state.isApp || params.get("platform") || !hints || hints.platform !== "Windows" ||
          typeof hints.getHighEntropyValues !== "function") return;
      hints.getHighEntropyValues(["bitness"]).then((values) => {
        const arch = values.bitness === "32" ? "x86" : values.bitness === "64" ? "x64" : "";
        if (arch && arch !== state.appPlatform) {
          state.appPlatform = arch;
          renderPlugins();
        }
      }).catch(() => {});
    }

    init();
  </script>
</body>
</html>
